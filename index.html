  <script>
    // =========================================================================

    const PACKAGES = [
      { level: 1,  name: "Starter Box 1",     pv: 190,    amount: 190,    pairIncome: 137 },
      { level: 2,  name: "Growth Box 2",      pv: 380,    amount: 380,    pairIncome: 274 },

      { level: 10, name: "Ambassador Box 10", pv: 97280,  amount: 97280,  pairIncome: 70042 },
      { level: 11, name: "Legend Box 11",     pv: 286720, amount: 286720, pairIncome: 206438 }
    ];

    const SESSIONS = [
      { id: 1, label: "Session 1 (06:00 AM - 08:15 AM)" },
      { id: 2, label: "Session 2 (08:15 AM - 10:30 AM)" },
      { id: 3, label: "Session 3 (10:30 AM - 12:45 PM)" },
      { id: 4, label: "Session 4 (12:45 PM - 03:00 PM)" },
      { id: 5, label: "Session 5 (03:00 PM - 05:15 PM)" },
      { id: 6, label: "Session 6 (05:15 PM - 07:30 PM)" },
      { id: 7, label: "Session 7 (07:30 PM - 09:45 PM)" },
      { id: 8, label: "Session 8 (09:45 PM - 12:00 AM)" }
    ];

    const DEFAULT_PASSWORD = "1234";
    const STORAGE_KEY = "global_smpl_190pv_11boards_v4";

    function createEmptyBoxes(unlockedUpToLevel) {
      const boxStates = {};
      PACKAGES.forEach(p => {
        boxStates[p.level] = {
          unlocked: p.level <= unlockedUpToLevel,
          leftPv: 0,
          rightPv: 0,
          pairsCompleted: 0,
          totalPairsMatched: 0,
          cashEarned: 0,
          upgradePvAccumulated: 0
        };
      });
      return boxStates;
    }

    function ensureMemberBoardSchema(m) {
      if (!m.boxes) m.boxes = createEmptyBoxes(m.activePackageLevel || 1);
      if (!m.bankDetails || typeof m.bankDetails !== "object") {
        m.bankDetails = {
          accountHolder: m.name || "",
          bankName: "",
          accountNumber: "",
          ifscCode: "",
          upiId: ""
        };
      } else {
        m.bankDetails.accountHolder = m.bankDetails.accountHolder || "";
        m.bankDetails.bankName = m.bankDetails.bankName || "";
        m.bankDetails.accountNumber = m.bankDetails.accountNumber || "";
        m.bankDetails.ifscCode = m.bankDetails.ifscCode || "";
        m.bankDetails.upiId = m.bankDetails.upiId || "";
      }
      if (!m.address || typeof m.address !== "object") {
        m.address = { village: "", postBlock: "", district: "", state: "Odisha", pin: "" };
      }
      if (!m.nominee || typeof m.nominee !== "object") {
        m.nominee = { name: "", relation: "Spouse", age: 25, contact: "" };
      }
      if (typeof m.totalCashPaidOut !== "number") {
        m.totalCashPaidOut = 0;
      }
      PACKAGES.forEach(p => {
        if (!m.boxes[p.level]) {
          m.boxes[p.level] = {
            unlocked: p.level <= (m.activePackageLevel || 1),
            leftPv: 0,
            rightPv: 0,
            pairsCompleted: 0,
            totalPairsMatched: 0,
            cashEarned: 0,
            upgradePvAccumulated: 0
          };
        } else {
          if (typeof m.boxes[p.level].leftPv !== "number") m.boxes[p.level].leftPv = 0;
          if (typeof m.boxes[p.level].rightPv !== "number") m.boxes[p.level].rightPv = 0;
          if (typeof m.boxes[p.level].pairsCompleted !== "number") m.boxes[p.level].pairsCompleted = 0;
          if (typeof m.boxes[p.level].totalPairsMatched !== "number") m.boxes[p.level].totalPairsMatched = 0;
          if (typeof m.boxes[p.level].cashEarned !== "number") m.boxes[p.level].cashEarned = 0;
          if (typeof m.boxes[p.level].upgradePvAccumulated !== "number") m.boxes[p.level].upgradePvAccumulated = 0;
        }
      });
      return m;
    }

    // =========================================================================
    // 2. INITIAL STATE & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    function createInitialState() {
      return {
        currentSessionIdx: 0,
        closedSessionsCount: 0,
        companyMonthlyPv: 0,
        companyTotalCollection: 0,
        totalMemberCashPayouts: 0,
        totalDisbursedToMembers: 0,
        adminNetProfitBalance: 0,
        adminExpenses: 0,
        adminPaymentDetails: {
          accountHolder: "GLOBAL SMPL / RD ENTERPRISES",
          upiId: "9165131659-2@ybl",
          bankName: "State Bank of India",
          accountNumber: "44871128794",
          ifscCode: "SBIN0005762",
          qrNote: "Pay exact board amount via UPI / QR / Bank & enter UTR"
        },
        roleView: "member",
        memberLoggedIn: true,
        adminLoggedIn: false,
        activeMemberId: "SMPL1001",
        memberTab: "dashboard",
        adminTab: "utr",
        selectedAdminMemberId: null,
        editingMemberId: null,
        payingMemberId: null,
        lastCreatedCredentials: null,
        selectedJoinPkgLevel: 1,
        selectedJoinLeg: "LEFT",
        selectedPaymentMode: "UPI",
        payoutRecords: [],
        newsItems: [
          { id: "N1", text: "GLOBAL SMPL • RD ENTERPRISES: 190 PV Base 11-Boards Plan (1 PV = ₹1) | All Unlocked Boards Run Simultaneously | Max 1 Pair/Board/Session | Power Leg Carry-Forward & Weaker Leg Lapse." }
        ],
        youtubeLinks: [
          { id: "YT1", title: "190 PV 11-Boards Binary Plan Full Training", url: "https://youtube.com" }
        ],
        taxDeposits: [
          {
            id: "DEP-01",
            month: "November 2026",
            head: "Sec 194H / Commission TDS (Income Tax / TRACES)",
            whereToDeposit: "NSDL / e-Filing Portal - Challan 281 (TDS/TCS)",
            amount: 0,

            challanNo: ""
          }
        ],
        tdsEntries: [],
        members: [
          {
            id: "SMPL1001",
            password: DEFAULT_PASSWORD,
            name: "Company Root ID",
            mobile: "9000000001",
            age: 35,
            sponsorId: "COMPANY",
            placement: "ROOT",
            parentId: null,

              village: "Main Office",

            },
            pan: "ABCDE1234F",
            hasPan: true,
            bankDetails: {
              accountHolder: "Company Root ID",
              bankName: "State Bank of India",
              accountNumber: "44871128794",
              ifscCode: "SBIN0005762",
              upiId: "9165131659-2@ybl"
            },
            bankInfo: "Company Primary Account",
            nominee: {
              name: "Primary Nominee",
              relation: "Spouse",
              age: 32,
              contact: "9000000002"
            },
            activePackageLevel: 1,
            leftPv: 0,
            rightPv: 0,
            cashWallet: 0,
            totalCashPaidOut: 0,
            upgradeWalletPv: 0,
            totalTdsDeposited: 0,
            boxes: createEmptyBoxes(1)
          }
        ]
      };
    }

    let state = loadState();
    applyReferralParamsFromUrl();

    function applyReferralParamsFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const refId = (params.get("ref") || "").trim().toUpperCase();
        const legParam = (params.get("leg") || "").trim().toUpperCase();
        if (refId) {
          const foundSponsor = getMemberById(refId);
          state.activeMemberId = foundSponsor ? foundSponsor.id : refId;
          state.roleView = "member";
          state.memberTab = "join";
        }
        if (legParam === "LEFT" || legParam === "RIGHT") {
          state.selectedJoinLeg = legParam;
          if (!refId) {
            state.roleView = "member";
            state.memberTab = "join";
          }
        }
      } catch (e) {}
    }

    function buildReferralLink(memberId, legSide) {
      const cleanLeg = legSide === "RIGHT" ? "RIGHT" : "LEFT";
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?ref=${encodeURIComponent(memberId)}&leg=${cleanLeg}`;
    }

    function buildWhatsappReferralUrl(memberId, memberName, legSide) {
      const cleanLeg = legSide === "RIGHT" ? "RIGHT" : "LEFT";
      const link = buildReferralLink(memberId, cleanLeg);
      const msg =
        `Namaste! GLOBAL SMPL • RD ENTERPRISES (190 PV 11-Boards Plan) mein join karne ke liye mera ${cleanLeg} LEG referral link:\n` +
        `Sponsor ID: ${memberId} (${memberName})\n` +
        `Leg: ${cleanLeg}\n` +
        `Joining Link: ${link}`;
      return `https://wa.me/?text=${encodeURIComponent(msg)}`;
    }

    function copyReferralLink(memberId, legSide, btnEl) {
      const link = buildReferralLink(memberId, legSide);
      const onSuccess = () => {
        if (btnEl) {
          const orig = btnEl.textContent;
          btnEl.textContent = "✓ Copied!";
          setTimeout(() => { btnEl.textContent = orig; }, 1600);
        }
        showCopyToast(`${legSide} Referral Link Copied`);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(onSuccess).catch(() => mobileFallbackCopy(link, onSuccess));
      } else {
        mobileFallbackCopy(link, onSuccess);
      }
    }

    function renderReferralShareCard(member) {
      const leftLink = buildReferralLink(member.id, "LEFT");
      const rightLink = buildReferralLink(member.id, "RIGHT");
      const leftWa = buildWhatsappReferralUrl(member.id, member.name, "LEFT");
      const rightWa = buildWhatsappReferralUrl(member.id, member.name, "RIGHT");

      return `
        <div class="bg-slate-800/95 border border-emerald-500/40 rounded-2xl p-4 space-y-3 text-xs">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold text-emerald-300">WhatsApp Referral Links</h3>
              <p class="text-[11px] text-slate-400">Link kholte hi Sponsor ID (${escapeHtml(member.id)}) aur Leg auto-fill hoga.</p>
            </div>
            <span class="text-[10px] font-mono bg-slate-900 text-amber-300 px-2 py-1 rounded-lg border border-slate-700">${escapeHtml(member.id)}</span>
          </div>

          <div class="bg-slate-900 border border-sky-500/30 rounded-xl p-2.5 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sky-300">◀ LEFT LEG Referral Link</span>
              <div class="flex gap-1.5">
                <button type="button" onclick="copyReferralLink('${escapeAttr(member.id)}', 'LEFT', this)" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-2.5 py-1 rounded-lg text-[11px]">Copy</button>
                <a href="${escapeAttr(leftWa)}" target="_blank" rel="noopener noreferrer" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-2.5 py-1 rounded-lg text-[11px]">WhatsApp</a>
              </div>
            </div>
            <div class="font-mono text-[10px] text-slate-300 break-all bg-slate-950 px-2.5 py-1.5 rounded-lg">${escapeHtml(leftLink)}</div>
          </div>

          <div class="bg-slate-900 border border-purple-500/30 rounded-xl p-2.5 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-bold text-purple-300">RIGHT LEG Referral Link ▶</span>
              <div class="flex gap-1.5">
                <button type="button" onclick="copyReferralLink('${escapeAttr(member.id)}', 'RIGHT', this)" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-2.5 py-1 rounded-lg text-[11px]">Copy</button>
                <a href="${escapeAttr(rightWa)}" target="_blank" rel="noopener noreferrer" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-2.5 py-1 rounded-lg text-[11px]">WhatsApp</a>
              </div>
            </div>
            <div class="font-mono text-[10px] text-slate-300 break-all bg-slate-950 px-2.5 py-1.5 rounded-lg">${escapeHtml(rightLink)}</div>
          </div>
        </div>
      `;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("global_smpl_190pv_11boards_v3");
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        const init = createInitialState();
        const merged = {
          ...init,
          ...parsed,
          adminPaymentDetails: {
            ...init.adminPaymentDetails,
            ...(parsed && parsed.adminPaymentDetails ? parsed.adminPaymentDetails : {})
          },
          payoutRecords: Array.isArray(parsed && parsed.payoutRecords) ? parsed.payoutRecords : []
        };
        merged.members = (merged.members || []).map(ensureMemberBoardSchema);
        return merged;
      } catch (e) {
        return createInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Storage save failed", e);
      }
    }

    function resetToZeroState() {
      if (!confirm("Reset all data back to 0 turnover, ₹0 profit/payouts, and 1 Root Member?")) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("global_smpl_190pv_11boards_v3");
      state = createInitialState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function generateNextMemberId() {
      let maxNum = 1000;
      state.members.forEach(m => {
        const match = /^SMPL(\d+)$/i.exec(String(m.id || "").trim());
        if (match) {
          const num = parseInt(match[1], 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        }
      });
      return "SMPL" + (maxNum + 1);
    }

    // =========================================================================
    // 3. TREE HELPERS & BOARD-ISOLATED PV PROPAGATION
    // =========================================================================
    function getMemberById(id) {
      return state.members.find(m => m.id === id) || null;
    }

    function findPlacementSlot(startId, side) {
      let current = getMemberById(startId);
      if (!current) current = state.members[0];
      const childKey = side === "LEFT" ? "leftChildId" : "rightChildId";
      while (current && current[childKey]) {
        const nextNode = getMemberById(current[childKey]);
        if (!nextNode) break;
        current = nextNode;
      }
      return { parent: current, side };
    }

    function collectLegMembers(startChildId) {
      const list = [];
      if (!startChildId) return list;
      const queue = [{ id: startChildId, depth: 1 }];
      const visited = new Set();
      while (queue.length > 0 && list.length < 300) {
        const curr = queue.shift();
        if (!curr || visited.has(curr.id)) continue;
        visited.add(curr.id);
        const m = getMemberById(curr.id);
        if (!m) continue;
        list.push({ member: m, depth: curr.depth });
        if (m.leftChildId) queue.push({ id: m.leftChildId, depth: curr.depth + 1 });
        if (m.rightChildId) queue.push({ id: m.rightChildId, depth: curr.depth + 1 });
      }
      return list;
    }

    function propagateBoardPvUpward(childId, boardLevel, pvAmount, countMonthlyTurnover) {
      let currChild = getMemberById(childId);
      let guard = 0;
      while (currChild && currChild.parentId && guard < 200) {
        const parent = getMemberById(currChild.parentId);
        if (!parent) break;
        ensureMemberBoardSchema(parent);
        const targetBox = parent.boxes[boardLevel];

        if (parent.leftChildId === currChild.id) {
          parent.leftPv += pvAmount;
          if (targetBox) targetBox.leftPv += pvAmount;
        } else if (parent.rightChildId === currChild.id) {
          parent.rightPv += pvAmount;
          if (targetBox) targetBox.rightPv += pvAmount;
        }
        currChild = parent;
        guard++;
      }
      if (countMonthlyTurnover) {
        state.companyMonthlyPv += pvAmount;
      }
    }

    function approveMemberUtr(memberId) {
      const m = getMemberById(memberId);
      if (!m || m.status === "ACTIVE") return;
      ensureMemberBoardSchema(m);

      const sponsor = getMemberById(m.sponsorId) || state.members[0];
      const slot = findPlacementSlot(sponsor.id, m.placement);
      m.parentId = slot.parent ? slot.parent.id : null;

      if (slot.parent) {
        if (m.placement === "LEFT") {
          slot.parent.leftChildId = m.id;
        } else {
          slot.parent.rightChildId = m.id;
        }
      }

      const pkgObj = PACKAGES[m.activePackageLevel - 1] || PACKAGES[0];
      m.status = "ACTIVE";
      state.companyTotalCollection += m.joiningAmount;

      for (let lvl = 1; lvl <= pkgObj.level; lvl++) {
        const bPkg = PACKAGES[lvl - 1];
        if (bPkg) {
          propagateBoardPvUpward(m.id, lvl, bPkg.pv, lvl === pkgObj.level);
        }
      }

      saveState();
      render();
      alert(
        `UTR Confirmed!\n` +
        `${m.name} (${m.id}) is now ACTIVE on Board #${pkgObj.level} (${pkgObj.pv} PV).\n` +
        `Member placed in ${m.placement} leg and PV credited to upline!`
      );
    }

    function markMemberUtrFake(memberId) {
      const m = getMemberById(memberId);
      if (!m || m.status === "ACTIVE") return;
      m.status = "FAKE";
      saveState();
      render();
    }

    function deleteUnapprovedMember(memberId) {
      const m = getMemberById(memberId);
      if (!m || m.id === "SMPL1001" || m.status === "ACTIVE") return;
      if (!confirm(`Delete entry for ${m.name} (${m.id})?`)) return;
      state.members = state.members.filter(x => x.id !== memberId);
      saveState();
      render();
    }

    // =========================================================================
    // 4. SIMULTANEOUS 11-BOARD SESSION ENGINE
    // =========================================================================
    function closeCurrentSessionManual() {
      const closedSession = SESSIONS[state.currentSessionIdx];
      let totalSessionNetCash = 0;
      let totalSessionAdminCharge = 0;
      let totalSessionTds = 0;
      let totalPairsAcrossAllBoards = 0;
      const upgradeEvents = [];

      state.members.forEach(m => {
        if (m.status !== "ACTIVE") return;
        ensureMemberBoardSchema(m);

        for (let lvl = 1; lvl <= PACKAGES.length; lvl++) {
          const pkg = PACKAGES[lvl - 1];
          const box = m.boxes[lvl];
          if (!pkg || !box || !box.unlocked) continue;

          if (box.leftPv >= pkg.pv && box.rightPv >= pkg.pv) {
            const remLeft = box.leftPv - pkg.pv;
            const remRight = box.rightPv - pkg.pv;

            if (remLeft >= remRight) {
              box.leftPv = remLeft;
              box.rightPv = 0;
            } else {
              box.rightPv = remRight;
              box.leftPv = 0;
            }

            box.pairsCompleted += 1;
            box.totalPairsMatched += 1;
            totalPairsAcrossAllBoards += 1;

            const cyclePos = ((box.pairsCompleted - 1) % 8) + 1;
            const pairGross = pkg.pairIncome;

            if (cyclePos <= 4) {
              const adminFee = Math.round(pairGross * 0.10);
              const tdsRate = m.hasPan ? 5 : 20;
              const tdsFee = Math.round(pairGross * (tdsRate / 100));
              const netCash = Math.max(0, pairGross - adminFee - tdsFee);

              box.cashEarned += netCash;
              m.cashWallet += netCash;
              m.totalTdsDeposited += tdsFee;

              totalSessionNetCash += netCash;
              totalSessionAdminCharge += adminFee;
              totalSessionTds += tdsFee;

              if (tdsFee > 0) {
                state.tdsEntries.unshift({
                  id: "TDS-" + Math.floor(1000 + Math.random() * 9000),
                  month: "November 2026",
                  memberId: m.id,
                  memberName: m.name,
                  boardLevel: lvl,
                  pan: m.hasPan ? m.pan : "",
                  hasPan: m.hasPan,
                  grossPayout: pairGross,
                  adminCharge: adminFee,
                  tdsRate: tdsRate,
                  tdsAmount: tdsFee,
                  netPayable: netCash,
                  deposited: false
                });
              }
            } else {
              box.upgradePvAccumulated += pkg.pv;
              m.upgradeWalletPv += pkg.pv;

              while (m.activePackageLevel < PACKAGES.length) {
                const nextPkg = PACKAGES[m.activePackageLevel];
                if (!nextPkg || m.upgradeWalletPv < nextPkg.pv) break;
                m.upgradeWalletPv -= nextPkg.pv;
                m.activePackageLevel += 1;
                if (m.boxes[m.activePackageLevel]) {
                  m.boxes[m.activePackageLevel].unlocked = true;
                }
                upgradeEvents.push({
                  memberId: m.id,
                  newBoardLevel: m.activePackageLevel,
                  newBoardPv: nextPkg.pv
                });
              }
            }
          }
        }

        let sumLeft = 0;
        let sumRight = 0;
        PACKAGES.forEach(p => {
          sumLeft += m.boxes[p.level].leftPv;
          sumRight += m.boxes[p.level].rightPv;
        });
        m.leftPv = sumLeft;
        m.rightPv = sumRight;
      });

      upgradeEvents.forEach(ev => {
        propagateBoardPvUpward(ev.memberId, ev.newBoardLevel, ev.newBoardPv, false);
      });

      state.members.forEach(m => {
        ensureMemberBoardSchema(m);
        let sumLeft = 0;
        let sumRight = 0;
        PACKAGES.forEach(p => {
          sumLeft += m.boxes[p.level].leftPv;
          sumRight += m.boxes[p.level].rightPv;
        });
        m.leftPv = sumLeft;
        m.rightPv = sumRight;
      });

      if (totalSessionTds > 0 && state.taxDeposits[0]) {
        state.taxDeposits[0].amount += totalSessionTds;
        state.taxDeposits[0].status = "Pending Deposit";
      }

      state.totalMemberCashPayouts += totalSessionNetCash;
      state.adminNetProfitBalance += totalSessionAdminCharge;

      state.closedSessionsCount += 1;
      state.currentSessionIdx = (state.currentSessionIdx + 1) % SESSIONS.length;
      saveState();
      render();
      alert(
        `${closedSession.label} Closed!\n` +

    function renderElevenPackageBoxes(member) {
      ensureMemberBoardSchema(member);
      const nextPkg = PACKAGES[member.activePackageLevel] || null;

      return `
        <div class="space-y-3">
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2">

              Jaise-jaise agle boards unlock hote hain, pichle boards band nahi hote—<b>sabhi unlocked boards ek saath apna alag-alag 72% pair payout generate karte rehte hain</b>.
            </p>
            ${nextPkg ? (() => {
              const remNeed = Math.max(0, nextPkg.pv - member.upgradeWalletPv);
              const pct = Math.min(100, Math.round((member.upgradeWalletPv / nextPkg.pv) * 100));
              return `
                <div class="bg-amber-950/60 border border-amber-400/50 rounded-xl p-3 space-y-1.5 text-xs">
                  <div class="flex items-center justify-between font-bold">
                    <span class="text-amber-300">Next Unlock: Board #${nextPkg.level} (${nextPkg.pv.toLocaleString("en-IN")} PV)</span>
                    <span class="text-white">${pct}%</span>
                  </div>
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="text-emerald-300">Jama PV: <b>${member.upgradeWalletPv.toLocaleString("en-IN")} PV</b></span>
                    <span class="text-rose-300 font-bold">Need: ${remNeed.toLocaleString("en-IN")} PV aur chahiye</span>
                  </div>
                  <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
                    <div class="bg-amber-400 h-full" style="width:${pct}%"></div>
                  </div>
                </div>
              `;
            })() : `<div class="text-xs font-bold text-emerald-400">All 11 Boards Unlocked & Generating Payouts Simultaneously!</div>`}
          </div>

          ${PACKAGES.map(pkg => {
            const box = member.boxes[pkg.level] || { unlocked: false, leftPv: 0, rightPv: 0, pairsCompleted: 0, cashEarned: 0, upgradePvAccumulated: 0 };
            const isUnlocked = box.unlocked || pkg.level <= member.activePackageLevel;
            const cyclePairs = box.pairsCompleted % 8;

            return `
              <div class="rounded-2xl p-4 border ${isUnlocked ? 'bg-slate-800 border-emerald-500/50' : 'bg-slate-900/70 border-slate-800 opacity-75'}">
                <div class="flex items-center justify-between">
                  <div>
                    <span class="text-xs font-bold uppercase ${isUnlocked ? 'text-emerald-400' : 'text-slate-400'}">Board #${pkg.level}</span>
                    <div class="text-sm font-bold text-white">${escapeHtml(pkg.name)} — ${pkg.pv.toLocaleString("en-IN")} PV (₹${pkg.amount.toLocaleString("en-IN")})</div>
                  </div>
                  <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${isUnlocked ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">
                    ${isUnlocked ? 'RUNNING' : 'LOCKED'}
                  </span>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-2.5 text-xs bg-slate-900/90 rounded-xl px-3 py-2 border border-slate-700/70">
                  <div>Board Left PV: <b class="text-sky-400">${box.leftPv.toLocaleString("en-IN")} PV</b></div>
                  <div class="text-right">Board Right PV: <b class="text-purple-400">${box.rightPv.toLocaleString("en-IN")} PV</b></div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-2 text-center bg-slate-950/70 rounded-xl p-2.5">
                  <div>
                    <div class="text-[10px] text-slate-400">Pair Payout (72%)</div>
                    <div class="text-xs font-bold text-emerald-300">₹${pkg.pairIncome.toLocaleString("en-IN")}</div>
                  </div>
                  <div>
                    <div class="text-[10px] text-slate-400">4+4 Cycle</div>
                    <div class="text-xs font-bold text-amber-300">${cyclePairs} / 8 Pairs</div>
                  </div>
                  <div>
                    <div class="text-[10px] text-slate-400">Board Cash Earned</div>
                    <div class="text-xs font-bold text-white">₹${box.cashEarned.toLocaleString("en-IN")}</div>
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

              <div>

    function renderAdminPayoutCenter() {
      const membersWithDue = state.members.filter(m => (m.cashWallet || 0) > 0);
      const payingMember = state.payingMemberId ? ensureMemberBoardSchema(getMemberById(state.payingMemberId)) : null;
      const totalDue = membersWithDue.reduce((acc, m) => acc + (m.cashWallet || 0), 0);

      return `
        <div class="space-y-3">
          <div class="bg-slate-800 border border-emerald-500/40 rounded-2xl p-4 flex items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold text-emerald-300">Admin Member Payout Center</h2>
              <p class="text-xs text-slate-400">Due Wallet: <b class="text-amber-300">₹${totalDue.toLocaleString("en-IN")}</b> • Total Paid: <b class="text-emerald-400">₹${(state.totalDisbursedToMembers || 0).toLocaleString("en-IN")}</b></p>
            </div>
            ${renderAdminLogoutButton()}
          </div>

          ${payingMember ? (() => {
            const bd = payingMember.bankDetails;
            const upiPayUrl = bd.upiId
              ? `upi://pay?pa=${encodeURIComponent(bd.upiId)}&pn=${encodeURIComponent(bd.accountHolder || payingMember.name)}&am=${payingMember.cashWallet}&cu=INR&tn=${encodeURIComponent("SMPL-Payout-" + payingMember.id)}`
              : "";

              <form onsubmit="handleAdminRecordPayout(event, '${payingMember.id}')" class="bg-slate-900 border-2 border-emerald-400 rounded-2xl p-4 space-y-3 text-xs">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-bold text-emerald-300">Pay Payout to ${escapeHtml(payingMember.name)} (${payingMember.id})</div>
                    <div class="text-[11px] text-slate-400">Available Cash Wallet: <b class="text-amber-300">₹${payingMember.cashWallet.toLocaleString("en-IN")}</b></div>

                  <button type="button" onclick="closeAdminPayForm()" class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">Cancel</button>

                  <div class="flex items-center justify-between gap-2">
                    <span>A/C: <b class="font-mono text-white">${escapeHtml(bd.accountNumber || "Not Added")}</b></span>
                    ${bd.accountNumber ? `<button type="button" onclick="copyTextValue('${escapeAttr(bd.accountNumber)}', 'Account Number', this)" class="bg-slate-800 text-white font-bold px-2 py-0.5 rounded">Copy A/C</button>` : ""}

                  <div class="flex items-center justify-between gap-2">
                    <span>IFSC: <b class="font-mono text-amber-300">${escapeHtml(bd.ifscCode || "Not Added")}</b></span>
                    ${bd.ifscCode ? `<button type="button" onclick="copyTextValue('${escapeAttr(bd.ifscCode)}', 'IFSC Code', this)" class="bg-slate-800 text-white font-bold px-2 py-0.5 rounded">Copy IFSC</button>` : ""}

                  <div class="flex items-center justify-between gap-2">
                    <span>UPI: <b class="font-mono text-emerald-300">${escapeHtml(bd.upiId || "Not Added")}</b></span>

                      ${bd.upiId ? `<button type="button" onclick="copyTextValue('${escapeAttr(bd.upiId)}', 'Member UPI', this)" class="bg-emerald-600 text-slate-950 font-bold px-2 py-0.5 rounded">Copy UPI</button>` : ""}

          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2.5 text-xs">

      `;
    }

    function handleAdminRecordPayout(event, memberId) {
      event.preventDefault();
      const m = getMemberById(memberId);
      if (!m) return;
      ensureMemberBoardSchema(m);
      const fd = new FormData(event.target);
      const amount = parseInt(fd.get("amount") || "0", 10);
      const mode = (fd.get("mode") || "UPI").trim();
      const refNo = (fd.get("refNo") || "").trim().toUpperCase();
      const note = (fd.get("note") || "").trim();

      if (isNaN(amount) || amount <= 0 || amount > m.cashWallet) {
        alert(`Invalid payout amount! Available wallet: ₹${m.cashWallet}`);
        return;
      }
      if (!refNo) {
        alert("Please enter Transaction / UTR / Receipt Reference!");
        return;
      }

      const nowStr = new Date().toLocaleString("en-IN", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });

      m.cashWallet -= amount;
      m.totalCashPaidOut = (m.totalCashPaidOut || 0) + amount;
      state.totalDisbursedToMembers = (state.totalDisbursedToMembers || 0) + amount;

      state.payoutRecords.unshift({
        id: "PAY-" + Math.floor(10000 + Math.random() * 90000),
        memberId: m.id,
        memberName: m.name,
        amount,
        mode,
        refNo,
        note,
        paidAt: nowStr
      });

      state.payingMemberId = null;
      saveState();
      render();
      alert(`Payout of ₹${amount.toLocaleString("en-IN")} to ${m.name} (${m.id}) recorded! Ref: ${refNo}`);
    }

    function handleMemberLogin() {

      state.activeMemberId = found.id;

    function handleChangePassword(event, memberId) {
      event.preventDefault();

      const fd = new FormData(event.target);
      const curr = (fd.get("currentPass") || "").trim();
      const np = (fd.get("newPass") || "").trim();

    function handleNewJoining(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const sponsorId = (fd.get("sponsorId") || "SMPL1001").trim().toUpperCase();
      const placement = (fd.get("placement") || "LEFT").toUpperCase();
      const paymentMode = (fd.get("paymentMode") || "UPI").trim();
      const name = (fd.get("name") || "").trim();
      const mobile = (fd.get("mobile") || "").trim();
      const age = parseInt(fd.get("age") || "30", 10);
      const pkgLevel = parseInt(fd.get("pkgLevel") || "1", 10);
      const pkgObj = PACKAGES[pkgLevel - 1] || PACKAGES[0];
      const joiningAmount = parseInt(fd.get("joiningAmount") || String(pkgObj.amount), 10);
      const utrNumber = (fd.get("utrNumber") || "").trim().toUpperCase();

      const bankName = (fd.get("bankName") || "").trim();
      const accountNumber = (fd.get("accountNumber") || "").trim();
      const ifscCode = (fd.get("ifscCode") || "").trim().toUpperCase();
      const upiId = (fd.get("upiId") || "").trim();

      const sponsor = getMemberById(sponsorId) || state.members[0];
      const newId = generateNextMemberId();
      const panInput = (fd.get("pan") || "").trim().toUpperCase();
      const hasPan = fd.get("hasPan") === "true" && panInput.length > 0;

      const newMember = {
        id: newId,
        password: DEFAULT_PASSWORD,
        name,
        mobile,
        age,
        sponsorId: sponsor.id,
        placement,
        parentId: null,
        leftChildId: null,
        rightChildId: null,
        paymentMode,
        utrNumber,
        joiningAmount,
        status: "PENDING",
        address: {
          village: (fd.get("village") || "").trim(),
          postBlock: (fd.get("postBlock") || "").trim(),
          district: (fd.get("district") || "").trim(),
          state: (fd.get("state") || "Odisha").trim(),
          pin: (fd.get("pin") || "").trim()
        },
        pan: panInput,
        hasPan,
        bankDetails: {
          accountHolder: name,
          bankName,
          accountNumber,
          ifscCode,
          upiId
        },
        bankInfo: accountNumber ? `${bankName} • ${accountNumber} (${ifscCode})` : (upiId || "Pending Bank Update"),
        nominee: {
          name: (fd.get("nomineeName") || "").trim(),
          relation: (fd.get("nomineeRelation") || "Spouse").trim(),
          age: parseInt(fd.get("nomineeAge") || "25", 10),
          contact: (fd.get("nomineeContact") || "").trim()
        },
        activePackageLevel: pkgLevel,
        leftPv: 0,
        rightPv: 0,
        cashWallet: 0,
        totalCashPaidOut: 0,
        upgradeWalletPv: 0,
        totalTdsDeposited: 0,
        boxes: createEmptyBoxes(pkgLevel)
      };

      state.members.push(newMember);
      state.lastCreatedCredentials = { id: newId, password: DEFAULT_PASSWORD, name, placement, utr: utrNumber, paymentMode };
      state.memberLoggedIn = true;
      state.memberTab = "dashboard";
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleAddYoutube(event) {
      event.preventDefault();
      if (state.youtubeLinks.length >= 5) return;
      const fd = new FormData(event.target);

      state.youtubeLinks.push({ id: "YT-" + Date.now(), title, url });

    function togglePasswordVisibility(inputId, btnEl) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      if (inp.type === "password") {
        inp.type = "text";
        if (btnEl) btnEl.textContent = "🙈";
      } else {
        inp.type = "password";
        if (btnEl) btnEl.textContent = "👁";
      }
    }

    function copyTextValue(val, label, btnEl) {
      const clean = String(val || "").trim();
      if (!clean) return;
      const onSuccess = () => {
        if (btnEl) {
          const origText = btnEl.textContent;
          btnEl.textContent = "✓ Copied";
          setTimeout(() => { btnEl.textContent = origText; }, 1600);
        }
        showCopyToast(`${label} Copied: ${clean}`);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(clean).then(onSuccess).catch(() => mobileFallbackCopy(clean, onSuccess));
      } else {
        mobileFallbackCopy(clean, onSuccess);
      }
    }

    function copyFieldWithFeedback(btnEl, fieldKey, label) {
      const map = {
        adminAccountNumber: state.adminPaymentDetails.accountNumber,
        adminIfscCode: state.adminPaymentDetails.ifscCode,
        adminUpiId: state.adminPaymentDetails.upiId
      };
      const val = String(map[fieldKey] || "").trim();
      if (!val) return;
      copyTextValue(val, label, btnEl);
    }

    function mobileFallbackCopy(val, onSuccess) {
      const ta = document.createElement("textarea");
      ta.value = val;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, val.length);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok && onSuccess) {
        onSuccess();
      } else {
        alert("Copy this value: " + val);
      }
    }

    function showCopyToast(msg) {
      let toast = document.getElementById("copyToastBanner");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "copyToastBanner";
        toast.className = "fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-2xl border border-emerald-200";
        document.body.appendChild(toast);
      }
      toast.textContent = "✓ " + msg;
      toast.style.display = "block";
      clearTimeout(window._copyToastTimer);
      window._copyToastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 2200);
    }

    function handleSaveAdminPaymentDetails(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.adminPaymentDetails = {
        upiId: (fd.get("upiId") || "").trim(),
        accountHolder: (fd.get("accountHolder") || "").trim(),
        bankName: (fd.get("bankName") || "").trim(),
        accountNumber: (fd.get("accountNumber") || "").trim(),
        ifscCode: (fd.get("ifscCode") || "").trim().toUpperCase(),
        qrNote: (fd.get("qrNote") || "").trim()
      };
      saveState();
      render();
      alert("Admin UPI, QR & Bank details updated and synced to Joining Form!");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(url) {
      const clean = String(url || "").trim();
      if (/^(https?:\/\/|https:\/\/wa\.me\/|upi:\/\/)/i.test(clean)) return escapeHtml(clean);
      return escapeHtml(clean);
    }

    render();
  </script>
