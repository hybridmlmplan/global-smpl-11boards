          totalPairsMatched: 0,
          cashEarned: 0,

      if (!m.boxes) m.boxes = createEmptyBoxes(m.activePackageLevel || 1);

          if (typeof m.boxes[p.level].rightPv !== "number") m.boxes[p.level].rightPv = 0;

    function normalizeStateData(parsed) {
      const init = createInitialState();
      const merged = {
        ...init,
        ...(parsed || {}),
        updatedAt: (parsed && typeof parsed.updatedAt === "number") ? parsed.updatedAt : 0,
        adminPaymentDetails: {
          ...init.adminPaymentDetails,
          ...(parsed && parsed.adminPaymentDetails ? parsed.adminPaymentDetails : {})
        },
        payoutRecords: Array.isArray(parsed && parsed.payoutRecords) ? parsed.payoutRecords : [],
        newsItems: Array.isArray(parsed && parsed.newsItems) && parsed.newsItems.length > 0 ? parsed.newsItems : init.newsItems,
        youtubeLinks: Array.isArray(parsed && parsed.youtubeLinks) && parsed.youtubeLinks.length > 0 ? parsed.youtubeLinks : init.youtubeLinks,
        taxDeposits: Array.isArray(parsed && parsed.taxDeposits) && parsed.taxDeposits.length > 0 ? parsed.taxDeposits : init.taxDeposits,
        tdsEntries: Array.isArray(parsed && parsed.tdsEntries) ? parsed.tdsEntries : []
      };

        ? parsed.members
        : (parsed && parsed.members && typeof parsed.members === "object" ? Object.values(parsed.members) : init.members);
      merged.members = rawMembers.map(ensureMemberBoardSchema);
      return merged;

          }

    }

    function loadState() {
      try {
        ["global_smpl_190pv_11boards_v3", "global_smpl_190pv_11boards_v4"].forEach(oldKey => {

        });
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        return normalizeStateData(JSON.parse(raw));
      } catch (e) {
        return createInitialState();
      }
    }

    async function pushStateToFirebase(snapshot) {
      if (isSyncingCloud) {
        hasPendingCloudPush = true;
        return;
      }
      isSyncingCloud = true;
      try {
        await fetch(FIREBASE_STATE_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(snapshot)
        });
        lastCloudSyncAt = Date.now();
      } catch (err) {
        console.warn("Firebase push failed:", err);
      } finally {
        isSyncingCloud = false;
        if (hasPendingCloudPush) {
          hasPendingCloudPush = false;
          pushStateToFirebase(state);
        }
      }
    }

    async function pullStateFromFirebase(shouldRenderIfNewer) {
      if (isSyncingCloud || hasPendingCloudPush) return false;
      try {
        const res = await fetch(`${FIREBASE_STATE_ENDPOINT}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return false;
        const remoteData = await res.json();
        if (!remoteData) {
          await pushStateToFirebase(state);
          return false;
        }
        const normalizedRemote = normalizeStateData(remoteData);
        const remoteTs = normalizedRemote.updatedAt || 0;
        const localTs = state.updatedAt || 0;

        if (remoteTs > localTs) {
          const keepView = {
            roleView: state.roleView,
            memberLoggedIn: state.memberLoggedIn,
            adminLoggedIn: state.adminLoggedIn,
            activeMemberId: state.activeMemberId,
            memberTab: state.memberTab,
            adminTab: state.adminTab,
            selectedAdminMemberId: state.selectedAdminMemberId,
            editingMemberId: state.editingMemberId,
            payingMemberId: state.payingMemberId,
            lastCreatedCredentials: state.lastCreatedCredentials,
            selectedJoinPkgLevel: state.selectedJoinPkgLevel,
            selectedJoinLeg: state.selectedJoinLeg,
            selectedPaymentMode: state.selectedPaymentMode
          };
          state = { ...normalizedRemote, ...keepView };
          if (!getMemberById(state.activeMemberId)) {
            state.activeMemberId = state.members[0] ? state.members[0].id : "SMPL1001";
          }
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
          lastCloudSyncAt = Date.now();
          if (shouldRenderIfNewer && !isUserEditingForm()) {
            render();
          }
          return true;
        } else if (localTs > remoteTs) {
          await pushStateToFirebase(state);
        }
        return false;
      } catch (err) {
        console.warn("Firebase pull failed:", err);
        return false;
      }
    }

    function isUserEditingForm() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = (el.tagName || "").toUpperCase();
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    }

    function saveState() {
      state.updatedAt = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Storage save failed", e);
      }
      pushStateToFirebase(state);
    }
